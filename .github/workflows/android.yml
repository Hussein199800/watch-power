name: Watch Power Lab verification and APK
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-build:
    if: github.repository == 'Hussein199800/watch-power'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run sync
      - name: Android engine tests and experimental APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: watch-power-lab-results
          path: |
            android/app/build/reports/
            tests/e2e/out/
      - name: Package experimental APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk watch-power-lab-debug.apk
          sha256sum watch-power-lab-debug.apk > watch-power-lab-debug.apk.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: watch-power-lab-apk
          path: watch-power-lab-debug.apk*
      - name: Publish experimental download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lab-$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"
          gh release create "$TAG" watch-power-lab-debug.apk watch-power-lab-debug.apk.sha256 --prerelease --title "طاقتي لاب — تجربة $TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
